name: outreach

# The heartbeat. See OS-ARCHITECTURE.md section 3.3.
#
# GitHub's scheduler cannot keep a 15-minute cadence. It is best-effort: in this
# repo every July run started 51 minutes to 2h39m late, and on 2026-09-24 it
# skipped every 15-minute slot all morning. So the cron does not keep time
# any more. One run holds a shift (scripts/shift.js), ticks on the wall clock,
# and dispatches its own successor before GitHub's 6-hour job limit. The cron
# below only restarts a chain that died.
#
# Public repo, so Actions minutes are free. The shift only runs weekdays
# 6am-8pm Pacific; overnight the chain rests and a morning cron restarts it.

on:
  schedule:
    # Restart net only. Hourly across the window, starting early because GitHub
    # delivers late; a run that arrives before 6am Pacific waits for the window.
    # UTC hours cover 6am-8pm Pacific in both PDT and PST.
    - cron: '7 11-23 * * 1-5'
    - cron: '7 0-3 * * 2-6'
  workflow_dispatch:
    inputs:
      job:
        description: 'Single job to run (ear, queue, health, probe). Blank starts a shift.'
        required: false
        type: string

permissions:
  contents: read
  actions: write   # lets the shift dispatch its successor

concurrency:
  # One shift at a time. A restart cron that fires while a shift is running
  # waits as the single pending run, and a newer one replaces it, so chains
  # cannot multiply. Never cancel a run in flight: it may be between a Gmail
  # send and the row that records it.
  group: outreach-heartbeat
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --omit=dev

      - name: Run
        id: run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.job }}" ]; then
            node scripts/tick.js --job=${{ inputs.job }}
          else
            node scripts/shift.js
          fi

      # Runs even if the shift step failed, as long as the shift asked for it.
      # A shift that hit its time limit mid-window must hand over, or the day
      # goes dark until the next restart cron is delivered.
      - name: Hand off to the next shift
        if: always() && steps.run.outputs.next == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run outreach.yml --ref "${{ github.ref_name }}"
